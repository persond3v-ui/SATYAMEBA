# ============================================================================
# SATYAMEBA — multi-node Docker Swarm stack.
#   Deploy from the MASTER (a swarm manager):
#     docker stack deploy -c docker-compose.swarm.yml satyameba
#   Workers join the swarm first via setup/worker_join.sh.
#
# Control-plane services are pinned to the manager; exporters run on every node
# (mode: global) so Prometheus sees the whole cluster. Notebooks are scheduled
# across workers by the swarm scheduler (load balancing) via SwarmSpawner.
# ============================================================================

networks:
  satyameba_net:
    driver: overlay
    attachable: true          # SwarmSpawner attaches notebook services here

volumes:
  pgdata:
  hubdata:
  grafana:
  prometheus:

configs:
  prometheus_yml:
    file: ./monitoring/prometheus/prometheus.swarm.yml

secrets:
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [satyameba_net]
    deploy:
      placement: { constraints: ["node.role == manager"] }
      restart_policy: { condition: any }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [satyameba_net]
    deploy:
      placement: { constraints: ["node.role == manager"] }
      restart_policy: { condition: any }

  gateway:
    image: satyameba/gateway:latest
    env_file: .env
    secrets:
      - source: jwt_private
        target: /run/secrets/jwt_private.pem
      - source: jwt_public
        target: /run/secrets/jwt_public.pem
    networks: [satyameba_net]
    deploy:
      replicas: 2                       # HA: two gateway replicas behind the edge
      placement: { constraints: ["node.role == manager"] }
      restart_policy: { condition: any }

  jupyterhub:
    image: satyameba/jupyterhub:latest
    environment:
      SAT_SPAWNER: swarm
      SAT_NOTEBOOK_IMAGE: ${SAT_NOTEBOOK_IMAGE}
      SAT_NETWORK: satyameba_net
      SAT_GPU_ENABLED: ${SAT_GPU_ENABLED}
      SAT_GPU_RESOURCE: ${SAT_GPU_RESOURCE:-gpu}
      SAT_MEM_LIMIT: ${SAT_MEM_LIMIT}
      SAT_CPU_LIMIT: ${SAT_CPU_LIMIT}
      SAT_SHARED_VOLUME: ${SAT_SHARED_VOLUME:-satyameba-shared}
      SAT_SHARED_MODE: ${SAT_SHARED_MODE:-rw}
      SAT_USER_STORAGE_MODE: ${SAT_USER_STORAGE_MODE:-volume}
      SAT_USER_HOST_BASE: ${SAT_USER_HOST_BASE:-/srv/satyameba/users}
      SAT_SHARED_HOST_PATH: ${SAT_SHARED_HOST_PATH:-/srv/satyameba/shared}
      SAT_HUB_API_TOKEN: ${SAT_HUB_API_TOKEN}
      SAT_HUB_GATEWAY_URL: http://gateway:8000
      SAT_INTERNAL_SHARED_SECRET: ${SAT_INTERNAL_SHARED_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hubdata:/srv/jupyterhub
      - /srv/satyameba:/srv/satyameba          # NFS share: Hub pre-creates user dirs
    networks: [satyameba_net]
    deploy:
      placement: { constraints: ["node.role == manager"] }   # needs swarm API
      restart_policy: { condition: any }

  edge:
    image: satyameba/edge:latest
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - ./secrets/certs:/etc/nginx/certs:ro
    networks: [satyameba_net]
    deploy:
      placement: { constraints: ["node.role == manager"] }
      restart_policy: { condition: any }

  prometheus:
    image: prom/prometheus:v2.53.0
    configs:
      - source: prometheus_yml
        target: /etc/prometheus/prometheus.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # swarm service discovery
      - prometheus:/prometheus
    networks: [satyameba_net]
    deploy:
      placement: { constraints: ["node.role == manager"] }

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [satyameba_net]
    deploy:
      placement: { constraints: ["node.role == manager"] }

  # ---- exporters: one per node ----
  node-exporter:
    image: prom/node-exporter:v1.8.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    networks: [satyameba_net]
    deploy:
      mode: global

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [satyameba_net]
    deploy:
      mode: global

  dcgm-exporter:
    image: nvidia/dcgm-exporter:3.3.6-3.4.2-ubuntu22.04
    networks: [satyameba_net]
    deploy:
      mode: global
      placement:
        constraints: ["node.labels.satyameba.gpu == true"]   # GPU nodes only
