# SATYAMEBA edge proxy + SPA host.
# This is the ONLY container that publishes ports (80/443). Everything else
# (gateway, jupyterhub, grafana, prometheus, db) stays on the internal network.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;                      # don't advertise nginx version
    client_max_body_size 64m;               # notebook uploads
    keepalive_timeout 65;

    # Basic shared rate-limit zones (edge-level brute-force dampening).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

    upstream gateway     { server gateway:8000; }
    upstream jupyterhub  { server jupyterhub:8000; }
    upstream grafana     { server grafana:3000; }

    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    # ---- HTTP : redirect everything to HTTPS --------------------------------
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ---- HTTPS --------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/satyameba.crt;
        ssl_certificate_key /etc/nginx/certs/satyameba.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # --- SPA static ---
        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }

        # --- gateway API ---
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://gateway;
            include /etc/nginx/proxy_common.conf;
        }
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://gateway;
            include /etc/nginx/proxy_common.conf;
        }
        location = /healthz { proxy_pass http://gateway; include /etc/nginx/proxy_common.conf; }

        # --- JupyterHub (notebooks) with websocket upgrade ---
        location /hub/  { proxy_pass http://jupyterhub; include /etc/nginx/proxy_ws.conf; }
        location /user/ { proxy_pass http://jupyterhub; include /etc/nginx/proxy_ws.conf; }

        # --- Grafana dashboards (admin monitoring tab) ---
        location /grafana/ {
            proxy_pass http://grafana/;
            include /etc/nginx/proxy_ws.conf;
        }
    }
}
