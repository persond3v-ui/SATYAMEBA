# Prometheus config for the SWARM deployment. Uses Docker Swarm service
# discovery so every exporter task on every node is scraped automatically as
# nodes join/leave. (The single-host compose deployment uses prometheus.yml.)
global:
  scrape_interval: 15s
  external_labels:
    cluster: satyameba

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: satyameba-gateway
    dns_sd_configs:
      - names: ["tasks.gateway"]
        type: A
        port: 8000

  - job_name: node-exporter
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: .*node-exporter
        action: keep
      - source_labels: [__meta_dockerswarm_task_slot]
        target_label: slot
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - source_labels: [__address__]
        regex: (.+?)(?::\d+)?
        target_label: __address__
        replacement: $1:9100

  - job_name: cadvisor
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: .*cadvisor
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - source_labels: [__address__]
        regex: (.+?)(?::\d+)?
        target_label: __address__
        replacement: $1:8080

  - job_name: dcgm
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: .*dcgm-exporter
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - source_labels: [__address__]
        regex: (.+?)(?::\d+)?
        target_label: __address__
        replacement: $1:9400
