# ============================================================================
# SATYAMEBA — single-host stack (dev / demo / single powerful node).
# For the multi-node lab deployment use docker-compose.swarm.yml + the join
# scripts (see README "Multi-node"). Only the `edge` service publishes ports.
# ============================================================================
name: satyameba

x-restart: &restart
  restart: unless-stopped

networks:
  satyameba_net:
    name: satyameba_net
    driver: bridge

volumes:
  pgdata:
  hubdata:
  grafana:
  prometheus:

services:
  db:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [satyameba_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway
    image: satyameba/gateway:latest
    <<: *restart
    env_file: .env
    secrets:
      - jwt_private.pem
      - jwt_public.pem
    networks: [satyameba_net]
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]

  jupyterhub:
    build: ./jupyterhub
    image: satyameba/jupyterhub:latest
    <<: *restart
    environment:
      SAT_SPAWNER: ${SAT_SPAWNER}
      SAT_NOTEBOOK_IMAGE: ${SAT_NOTEBOOK_IMAGE}
      SAT_NETWORK: ${SAT_NETWORK}
      SAT_GPU_ENABLED: ${SAT_GPU_ENABLED}
      SAT_MEM_LIMIT: ${SAT_MEM_LIMIT}
      SAT_CPU_LIMIT: ${SAT_CPU_LIMIT}
      SAT_HUB_API_TOKEN: ${SAT_HUB_API_TOKEN}
      SAT_HUB_GATEWAY_URL: http://gateway:8000
      SAT_INTERNAL_SHARED_SECRET: ${SAT_INTERNAL_SHARED_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hubdata:/srv/jupyterhub
    networks: [satyameba_net]
    depends_on: [gateway]
    expose: ["8000", "8081"]

  edge:
    build: ./frontend
    image: satyameba/edge:latest
    <<: *restart
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./secrets/certs:/etc/nginx/certs:ro
    networks: [satyameba_net]
    depends_on: [gateway, jupyterhub, grafana]

  prometheus:
    image: prom/prometheus:v2.53.0
    <<: *restart
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus:/prometheus
    networks: [satyameba_net]
    expose: ["9090"]

  grafana:
    image: grafana/grafana:11.1.0
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [satyameba_net]
    expose: ["3000"]

  node-exporter:
    image: prom/node-exporter:v1.8.1
    <<: *restart
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [satyameba_net]
    expose: ["9100"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    <<: *restart
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [satyameba_net]
    expose: ["8080"]

secrets:
  jwt_private.pem:
    file: ./secrets/jwt_private.pem
  jwt_public.pem:
    file: ./secrets/jwt_public.pem
