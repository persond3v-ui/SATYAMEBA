ll="#161b22" stroke="#4c8dff" stroke-width="2"/><text x="1320.0" y="189.0" fill="#e6edf3" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold">In-Lab traffic strip</text><text x="1320.0" y="207.0" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal">node-busy light · N sharing</text><text x="1320.0" y="220.0" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal">live RAM/VRAM/GPU/CPU</text><line x1="480.0" y1="600.0" x2="1320.0" y2="236" stroke="#4c8dff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="1160.1" y="460" width="159.79999999999998" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="1240" y="474" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">/traffic (scoped token)</text><rect x="560" y="740" width="230" height="80" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="675.0" y="776.0" fill="#e6edf3" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold">Console TUI (curses)</text><text x="675.0" y="794.0" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal">per-node health + users</text><text x="675.0" y="807.0" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal">tty1 when DE removed</text><line x1="390.0" y1="390" x2="675.0" y2="740" stroke="#a371f7" stroke-width="2" marker-end="url(#arr)"/><rect x="400.0" y="550" width="140.0" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="470" y="564" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">GET /nodes/dashboard</text><rect x="850" y="740" width="360" height="92" rx="6" fill="#1c232d" stroke="#3fb950" stroke-width="1.4"/><text x="860" y="758" fill="#3fb950" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">Policy</text><text x="860" y="776" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">• Sharing = genuine concurrent execution (no caps).</text><text x="860" y="791" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">• Boost never preempts; newcomers queue + share.</text><text x="860" y="806" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">• At 3 a.m. an approved boost owns the whole cluster.</text><text x="860" y="821" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">• N is read live from the Node table — add nodes freely.</text></svg>