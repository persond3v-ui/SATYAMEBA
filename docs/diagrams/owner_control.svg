"bold">⚠ F2 ✓</text><text x="810" y="712" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">FIXED: watchdog seals/alerts once per tamper</text><text x="810" y="726" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">transition (no per-tick spam).</text><rect x="360" y="620" width="410" height="60" rx="6" fill="#2a0f0f" stroke="#d29922" stroke-width="1.6"/><text x="370" y="636" fill="#d29922" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">⚠ limits</text><text x="370" y="652" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">Running notebooks/processes need plaintext (root on a</text><text x="370" y="666" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">node can read live data/code). gocryptfs mount is the</text><text x="370" y="680" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">remaining wiring. Physical: LUKS/BIOS/TPM/locked rack.</text></svg>