-anchor="start" font-weight="bold">Per-request security path</text><text x="830" y="916" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">Every state-changing API call additionally passes:</text><text x="830" y="931" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">TLS edge → SecurityHeaders → CORS → RateLimit →</text><text x="830" y="946" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">BotFilter → RequestSigning(HMAC+nonce) → handler.</text><text x="830" y="961" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">Suspend/delete instantly revoke sessions + Hub server.</text><rect x="820" y="1040" width="380" height="46" rx="6" fill="#2a0f0f" stroke="#d29922" stroke-width="1.6"/><text x="830" y="1056" fill="#d29922" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">⚠ N13</text><text x="830" y="1072" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">SPA logout ends the SPA session but not the</text><text x="830" y="1086" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">Hub cookie/notebook in the other tab.</text></svg>