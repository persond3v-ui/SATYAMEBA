ns, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">no</text><line x1="640" y1="235" x2="640.0" y2="290" stroke="#f5a623" stroke-width="2" marker-end="url(#arr)"/><rect x="626.1" y="252.5" width="27.8" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="640.0" y="266.5" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">yes</text><line x1="640.0" y1="340" x2="640" y2="365" stroke="#f5a623" stroke-width="2" marker-end="url(#arr)"/><line x1="745" y1="400" x2="900" y2="400.0" stroke="#f5a623" stroke-width="2" marker-end="url(#arr)"/><rect x="811.9" y="390.0" width="21.2" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="822.5" y="404.0" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">no</text><line x1="640" y1="435" x2="640" y2="502.0" stroke="#f5a623" stroke-width="2" marker-end="url(#arr)"/><rect x="626.1" y="458.5" width="27.8" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="640.0" y="472.5" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">yes</text><line x1="740" y1="540" x2="900" y2="540.0" stroke="#f5a623" stroke-width="2" marker-end="url(#arr)"/><rect x="806.1" y="530.0" width="27.8" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="820.0" y="544.0" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">yes</text><line x1="990.0" y1="565" x2="820" y2="600" stroke="#f5a623" stroke-width="2" marker-end="url(#arr)"/><line x1="640" y1="578" x2="640" y2="652.0" stroke="#f5a623" stroke-width="2" marker-end="url(#arr)"/><rect x="622.8" y="605.0" width="34.4" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="640.0" y="619.0" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal