e="#d29922" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="300" y="560" width="250" height="60" rx="6" fill="#2a0f0f" stroke="#d29922" stroke-width="1.6"/><text x="310" y="576" fill="#d29922" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">⚠ F-SPOF</text><text x="310" y="592" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">D1 single Postgres + single Hub =</text><text x="310" y="606" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">single points of failure (HA wiring</text><text x="310" y="620" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">exists; you supply replicated PG).</text><line x1="425.0" y1="720" x2="620.0" y2="320" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="300" y="720" width="250" height="60" rx="6" fill="#2a0f0f" stroke="#3fb950" stroke-width="1.6"/><text x="310" y="736" fill="#3fb950" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">⚠ N1</text><text x="310" y="752" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">Internal secret is overloaded (node</text><text x="310" y="766" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">HMAC + Hub auth + SSO). Now decoupled</text><text x="310" y="780" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">from TOTP encryption key (fixed).</text><line x1="1450.0" y1="330" x2="1280" y2="353.0" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="1300" y="330" width="300" height="60" rx="6" fill="#2a0f0f" stroke="#f85149" stroke-width="1.6"/><text x="1310" y="346" fill="#f85149" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">⚠ N2/N3</text><text x="1310" y="362" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">Deleting a user does NOT remove D3</text><text x="1310" y="376" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">volume → storage leak, and a reused</text><text x="1310" y="390" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">username could inherit old files.</text><line x1="1450.0" y1="470" x2="890.0" y2="270" stroke="#d29922" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="1300" y="470" width="300" height="60" rx="6" fill="#2a0f0f" stroke="#d29922" stroke-width="1.6"/><text x="1310" y="486" fill="#d29922" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">⚠ N13</text><text x="1310" y="502" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">SPA logout does not end the Hub</text><text x="1310" y="516" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">session in the other tab (suspend</text><text x="1310" y="530" fill="#f0c9c9" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal">does, via hub.delete_user).</text></svg>