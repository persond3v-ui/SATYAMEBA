roke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><rect x="456.2" y="225.0" width="47.6" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="480.0" y="239.0" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">/api/*</text><line x1="440" y1="250" x2="800" y2="250" stroke="#f5a623" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><rect x="698.0" y="240" width="74.0" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="735" y="254" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">/hub /user</text><line x1="620.0" y1="320" x2="620.0" y2="420" stroke="#f5a623" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><rect x="606.1" y="390" width="27.8" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="620" y="404" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">ORM</text><line x1="560" y1="320" x2="560" y2="500" stroke="#f5a623" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><rect x="433.0" y="480" width="74.0" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="470" y="494" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">rate/nonce</text><line x1="720" y1="235.0" x2="800" y2="210.0" stroke="#f5a623" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><rect x="692.0" y="176" width="140.0" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="762" y="190" fill="#8b949e" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">admin API · internal</text><line x1="980" y1="210.0" x2="1080" y2="210.0" stroke="#f5a623" stroke-width="2" marker-end="url(#arr)"/><rect x="1009.5" y="190" width="41.0" height="17" rx="3" fill="#0e1116" opacity="0.85"/><text x="1030"